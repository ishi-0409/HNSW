[project]
name = "hnsw-thesis"
version = "0.1.0"
description = "HNSW およびグラフ近似最近傍探索の実装と実験（卒論用）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy",
    "pandas>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "matplotlib",
]

# パッケージとして配布しないので、uv にプロジェクト自体をインストールさせない
[tool.uv]
package = false
