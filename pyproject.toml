[project]
name = "hnsw-thesis"
version = "0.1.0"
description = "HNSW およびグラフ近似最近傍探索の実装と実験（卒論用）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hnsw_thesis"]
